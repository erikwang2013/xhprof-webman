  <path d="M130 34 C127 58 141 74 152 90 C168 110 178 126 178 146 C178 180 152 202 119 202 C86 202 60 180 60 146 C60 120 74 102 88 84 C99 70 106 58 108 46 C113 54 120 56 130 34 Z" fill="#6e7781"/>
