# 类型化配置 schema：没有它，drush config:export/import 与 config_inspector 会报
# "missing schema"。键集必须与 config/install/xhprof.settings.yml 一致。
xhprof.settings:
  type: config_object
  label: 'XHProf settings'
  mapping:
    enable:
      type: boolean
      label: 'Enable profiling'
    sample_rate:
      type: float
      label: 'Fraction of requests to profile (0.05 = 5%, 1 = all, <=0 = none)'
    trigger_token:
      type: string
      label: 'Token that forces sampling when sent in the X-Xhprof-Token header (empty = disabled)'
      nullable: true
    auth_basic:
      type: string
      label: 'HTTP Basic credentials "user:password" (empty = disabled; OR-ed with auth_token, either one admitted)'
      nullable: true
    ip_allowlist:
      type: sequence
      label: 'Client IPs allowed to view the report (exact string match, no CIDR, no IPv6 normalisation; empty = disabled, non-array = fail closed)'
      sequence:
        type: string
        label: 'IP address'
    trusted_proxies:
      type: sequence
      label: 'Deployment declaration that the app runs behind a trusted proxy (lets ip_allowlist trust X-Forwarded-For / X-Real-IP; it cannot stop forged headers)'
      sequence:
        type: string
        label: 'Proxy IP address'
    webhook_url:
      type: string
      label: 'Slow-request webhook URL, POST JSON after a run is stored (empty = disabled; fire-and-forget, no queue, no retry)'
      nullable: true
    sample_cli:
      type: boolean
      label: 'Profile CLI runs that have no HTTP request; stored as cli:<script name>'
    symbol_lookup_url:
      type: string
      label: 'Source code lookup template; ?symbol=<urlencoded name> is appended (empty = no links)'
      nullable: true
    max_runs_per_minute:
      type: integer
      label: 'Maximum runs recorded per minute (empty = unlimited; falls back to sample_rate when the cache is unavailable)'
      nullable: true
    time_limit:
      type: integer
      label: 'Only record requests slower than this many seconds (0 = every request)'
    log_num:
      type: integer
      label: 'Maximum number of runs to keep'
    view_wtred:
      type: integer
      label: 'Mark list rows slower than this many seconds in red'
    ignore_url_arr:
      type: sequence
      label: 'URL substrings that are not recorded'
      sequence:
        type: string
        label: 'URL substring'
    assets_url:
      type: string
      label: 'URL prefix of the bundled static assets'
    auth_token:
      type: string
      label: 'Token required to view the report (empty = no auth)'
      nullable: true
    key_prefix:
      type: string
      label: 'Redis key prefix'
    log_ttl:
      type: integer
      label: 'Run retention in seconds'
    locale:
      type: string
      label: 'Report page language (empty = negotiate from Accept-Language)'
      nullable: true
