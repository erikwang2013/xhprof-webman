<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif">
  <title>設計のトレードオフ：判断・理由・コスト</title>
  <desc>5 つの主要な判断の対照表で、各項目は判断そのもの、それが得た利益、そして支払ったコストを並べる：Core は 5 つの契約のみに依存、入口クラスがレポートページを自前で配信、共有層は抽出しない、スタブは独立した検証ループが検証、autoDetect ではなく明示的注入。 機械翻訳。 この文書は自動翻訳されたもので、母語話者による校閲を受けていません。内容が食い違う場合は 英語版 を正とします。</desc>

  <rect x="0" y="0" width="1200" height="640" fill="#f6f8fa"/>

  <!-- ============ 标题 ============ -->
  <text x="32" y="44" font-size="22" font-weight="700" fill="#24292f">設計のトレードオフ：判断 → 理由 → コスト</text>
  <text x="32" y="70" font-size="13" fill="#57606a">5 つの判断がそれぞれ何を得て、何を支払ったか</text>

  <!-- 结论条 -->
  <rect x="24" y="88" width="1152" height="42" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="600" y="114" font-size="14" font-weight="600" fill="#0550ae" text-anchor="middle">6 つの新フレームワークによる src/Core/ の変更 = 0</text>

  <!-- ============ 表头 ============ -->
  <rect x="24" y="146" width="376" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="38" y="157" width="10" height="10" rx="2" fill="#0969da"/>
  <text x="56" y="168" font-size="12.5" font-weight="600" fill="#0969da">判断 · 何を選んだか</text>

  <rect x="412" y="146" width="376" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="426" y="157" width="10" height="10" rx="2" fill="#1a7f37"/>
  <text x="444" y="168" font-size="12.5" font-weight="600" fill="#1a7f37">理由 · 何を得たか</text>

  <rect x="800" y="146" width="376" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="814" y="157" width="10" height="10" rx="2" fill="#bc4c00"/>
  <text x="832" y="168" font-size="12.5" font-weight="600" fill="#bc4c00">コスト · 何を支払ったか</text>

  <!-- ============ 第 1 行：Core 只依赖 5 个契约 ============ -->
  <rect x="24" y="182" width="376" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="40" y="204" font-size="12.5" font-weight="600" fill="#0550ae">Core は 5 つの契約インターフェースのみに依存</text>
  <text x="40" y="224" font-size="11" fill="#24292f">src/Core/ はその 5 インターフェースのみを import し、</text>
  <text x="40" y="240" font-size="11" fill="#24292f">フレームワーククラスは import しない</text>

  <rect x="412" y="182" width="376" height="80" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="428" y="204" font-size="12.5" font-weight="600" fill="#1a7f37">フレームワーク追加 = ディレクトリ 1 つを追加</text>
  <text x="428" y="224" font-size="11" fill="#24292f">6 つの新フレームワークによる src/Core/ の変更は 0 行；</text>
  <text x="428" y="240" font-size="11" fill="#24292f">Webman/Laravel の挙動も影響を受けない</text>

  <rect x="800" y="182" width="376" height="80" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="816" y="204" font-size="12.5" font-weight="600" fill="#bc4c00">同じ契約を 10 回実装する</text>
  <text x="816" y="224" font-size="11" fill="#24292f">10 フレームワークがそれぞれ 5 つの Adapter を書き、</text>
  <text x="816" y="240" font-size="11" fill="#24292f">契約は保たれるが実装は書き直される</text>

  <!-- ============ 第 2 行：入口类自服务报告页 ============ -->
  <rect x="24" y="272" width="376" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="40" y="294" font-size="12.5" font-weight="600" fill="#0550ae">入口クラスがレポートページを自前で配信</text>
  <text x="40" y="314" font-size="11" fill="#24292f">入口クラスが start の前にパスを判定；レポートページ命中なら</text>
  <text x="40" y="330" font-size="11" fill="#24292f">withBody(Xhprof::index())-&gt;send() で即座に返す</text>

  <rect x="412" y="272" width="376" height="80" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="428" y="294" font-size="12.5" font-weight="600" fill="#1a7f37">フレームワークごとに 3 つの作業を削減</text>
  <text x="428" y="314" font-size="11" fill="#24292f">コントローラを書かず、レポートページのルートも登録せず、</text>
  <text x="428" y="330" font-size="11" fill="#24292f">アセットのルートも登録不要</text>

  <rect x="800" y="272" width="376" height="80" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="816" y="294" font-size="12.5" font-weight="600" fill="#bc4c00">短絡ロジックが 10 回繰り返される</text>
  <text x="816" y="314" font-size="11" fill="#24292f">その 3 箇所こそ推測を誤ってもテストが気づかない場所、</text>
  <text x="816" y="330" font-size="11" fill="#24292f">繰り返しが確実さを買う（Drupal 標準モジュールは例外）</text>

  <!-- ============ 第 3 行：不抽共享层 ============ -->
  <rect x="24" y="362" width="376" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="40" y="384" font-size="12.5" font-weight="600" fill="#0550ae">共有層は抽出しない</text>
  <text x="40" y="404" font-size="11" fill="#24292f">PSR-7（Yii3 / Slim）と HttpFoundation</text>
  <text x="40" y="420" font-size="11" fill="#24292f">（Symfony / Drupal）は形が同じでも個別に実装する</text>

  <rect x="412" y="362" width="376" height="80" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="428" y="384" font-size="12.5" font-weight="600" fill="#1a7f37">フレームワーク同士が完全に隔離される</text>
  <text x="428" y="404" font-size="11" fill="#24292f">あるフレームワークのアダプタ変更が他に波及せず、</text>
  <text x="428" y="420" font-size="11" fill="#24292f">共有ファイルの衝突面を最小に抑えられる</text>

  <rect x="800" y="362" width="376" height="80" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="816" y="384" font-size="12.5" font-weight="600" fill="#bc4c00">約 30 のほぼ重複したアダプタ</text>
  <text x="816" y="404" font-size="11" fill="#24292f">重複は明細に載り、ドリフトは載らない ——</text>
  <text x="816" y="420" font-size="11" fill="#24292f">parity テストがドリフトを赤信号に変える</text>

  <!-- ============ 第 4 行：桩由独立验证环校验 ============ -->
  <rect x="24" y="452" width="376" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="40" y="474" font-size="12.5" font-weight="600" fill="#0550ae">スタブは独立した検証ループが検証</text>
  <text x="40" y="494" font-size="11" fill="#24292f">アダプタを書く人が、それが依存するスタブを自分で書かない</text>
  <text x="40" y="510" font-size="11" fill="#24292f">スタブ・シグネチャ・セマンティクスを検証ループが独立に照合</text>

  <rect x="412" y="452" width="376" height="80" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="428" y="474" font-size="12.5" font-weight="600" fill="#1a7f37">循環論法を断ち切る</text>
  <text x="428" y="494" font-size="11" fill="#24292f">さもなくばスタブは作者のフレームワーク API 推測を忠実に写す：</text>
  <text x="428" y="510" font-size="11" fill="#24292f">単体テストは全緑、実機では Call to undefined method</text>

  <rect x="800" y="452" width="376" height="80" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="816" y="474" font-size="12.5" font-weight="600" fill="#bc4c00">検証の深さが均一でない</text>
  <text x="816" y="494" font-size="11" fill="#24292f">L2 のセマンティクスは 4.5/6 をカバー；WordPress は覆えず、</text>
  <text x="816" y="510" font-size="11" fill="#24292f">ソーステキストの照合と手動スモークのみ</text>

  <!-- ============ 第 5 行：显式注入而非 autoDetect ============ -->
  <rect x="24" y="542" width="376" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="40" y="564" font-size="12.5" font-weight="600" fill="#0550ae">autoDetect ではなく明示的注入</text>
  <text x="40" y="584" font-size="11" fill="#24292f">6 つの新フレームワークはすべて明示的注入：</text>
  <text x="40" y="600" font-size="11" fill="#24292f">Xhprof::bootstrap($req, $res, $cfg, $cache, $log)</text>

  <rect x="412" y="542" width="376" height="80" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="428" y="564" font-size="12.5" font-weight="600" fill="#1a7f37">「絶対に命中しない分岐」を消す</text>
  <text x="428" y="584" font-size="11" fill="#24292f">探索するクラス名の打ち間違い → 分岐は永久に命中せず；</text>
  <text x="428" y="600" font-size="11" fill="#24292f">この種の事故は本リポジトリの Hyperf 分岐が既に一度被っている</text>

  <rect x="800" y="542" width="376" height="80" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="816" y="564" font-size="12.5" font-weight="600" fill="#bc4c00">入口クラスが自分でアダプタを揃える必要がある</text>
  <text x="816" y="584" font-size="11" fill="#24292f">Core は探索をやめ、各入口クラスが自分で書く</text>
  <text x="816" y="600" font-size="11" fill="#24292f">約 30 行（5 つのアダプタ構築を含む）</text>
</svg>
