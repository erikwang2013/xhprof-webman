  <!-- ① → ② -->
  <line x1="600" y1="340" x2="600" y2="358" stroke="#57606a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="616" y="353" font-size="11.5" fill="#57606a">Las clases de entrada construyen 5 Adapters y los inyectan; Core solo llama de vuelta por estos 5 contratos</text>

  <!-- ============ ② 契约层 ============ -->
  <rect x="24" y="362" width="1152" height="120" rx="12" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/>
  <text x="44" y="390" font-size="14" font-weight="600" fill="#24292f">② Capa de contratos — las 5 interfaces de src/Core/Contract/</text>
  <text x="1156" y="390" font-size="11.5" fill="#57606a" text-anchor="end">Core solo llega a los frameworks por estas 5 caras; las implementa el directorio Adapter/ de cada framework</text>

  <rect x="45" y="402" width="206" height="66" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="59" y="429" font-size="13" font-weight="600" fill="#0969da">RequestInterface</text>
  <text x="59" y="452" font-size="11" fill="#57606a">8 métodos · leer petición</text>

  <rect x="271" y="402" width="206" height="66" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="285" y="429" font-size="13" font-weight="600" fill="#0969da">ResponseInterface</text>
  <text x="285" y="452" font-size="11" fill="#57606a">5 métodos · escribir respuesta</text>

  <rect x="497" y="402" width="206" height="66" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="511" y="429" font-size="13" font-weight="600" fill="#0969da">ConfigInterface</text>
  <text x="511" y="452" font-size="11" fill="#57606a">1 método get()</text>

  <rect x="723" y="402" width="206" height="66" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="737" y="429" font-size="13" font-weight="600" fill="#0969da">CacheInterface</text>
  <text x="737" y="452" font-size="11" fill="#57606a">9 métodos · leer/escribir Redis</text>

  <rect x="949" y="402" width="206" height="66" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="963" y="429" font-size="13" font-weight="600" fill="#0969da">LoggerInterface</text>
  <text x="963" y="452" font-size="11" fill="#57606a">1 método error()</text>

  <!-- ② → ③ -->
  <line x1="600" y1="486" x2="600" y2="504" stroke="#57606a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="616" y="499" font-size="11.5" fill="#57606a">Las 5 clases de Core solo llaman a métodos de interfaz y no conocen ninguna clase concreta de framework</text>

  <!-- ============ ③ Core ============ -->
  <rect x="24" y="508" width="1152" height="120" rx="12" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/>
  <text x="44" y="536" font-size="14" font-weight="600" fill="#24292f">③ Core — las 5 clases de src/Core/</text>
  <text x="1156" y="536" font-size="11.5" fill="#57606a" text-anchor="end">no importa ninguna clase de framework</text>

  <rect x="45" y="548" width="206" height="66" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="59" y="572" font-size="13" font-weight="600" fill="#24292f">Xhprof</text>
  <text x="59" y="590" font-size="10.5" fill="#57606a">bootstrap() index() deny()</text>
  <text x="59" y="605" font-size="10.5" fill="#57606a">xhprofStart() xhprofStop()</text>

  <rect x="271" y="548" width="206" height="66" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="285" y="572" font-size="13" font-weight="600" fill="#24292f">XhprofProfiler</text>
  <text x="285" y="590" font-size="10.5" fill="#57606a">start() stop()</text>
  <text x="285" y="605" font-size="10.5" fill="#57606a">isEnabled() bootstrap()</text>

  <rect x="497" y="548" width="206" height="66" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="511" y="572" font-size="13" font-weight="600" fill="#24292f">XHProfRunsDefault</text>
  <text x="511" y="590" font-size="10.5" fill="#57606a">save_run() get_run()</text>
  <text x="511" y="605" font-size="10.5" fill="#57606a">list_runs() · lista blanca de run_id</text>

  <rect x="723" y="548" width="206" height="66" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="737" y="572" font-size="13" font-weight="600" fill="#24292f">StaticController</text>
  <text x="737" y="590" font-size="10.5" fill="#57606a">serve()</text>
