  <title>Arquitectura por capas de XHProf Webman</title>
  <desc>Tres diagramas por capas: la capa superior son las 10 clases de entrada de framework (4 ya compatibles + 6 nuevas en esta versión), la intermedia son las 5 interfaces de src/Core/Contract/ y la inferior son las 5 clases de Core. La banda roja inferior marca los dos únicos acoplamientos a frameworks que quedan en Core y anota que los 6 frameworks nuevos nunca pasan por autoDetect: todos usan inyección explícita vía Xhprof::bootstrap(). Traducción automática sin revisar. Este documento es una traducción automática al español y no ha sido revisada por un hablante nativo; ante cualquier duda, la versión de referencia es la inglesa: README.EN.md.</desc>

