  <text x="963" y="590" font-size="10.5" fill="#57606a">displayXHProfReport()</text>
  <text x="963" y="605" font-size="10.5" fill="#57606a">xhprof_include_js_css()</text>

  <!-- ③ → ④ 红色耦合箭头 -->
  <line x1="100" y1="630" x2="100" y2="652" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="116" y="647" font-size="11.5" fill="#cf222e">Ambas cosas viven en Xhprof</text>

  <!-- ============ ④ 两处耦合 ============ -->
  <rect x="24" y="654" width="1152" height="200" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
  <rect x="44" y="668" width="252" height="26" rx="13" fill="#cf222e"/>
  <text x="170" y="686" font-size="9.96" font-weight="600" fill="#ffffff" text-anchor="middle">Los 2 únicos acoplamientos a frameworks en Core</text>
  <text x="312" y="686" font-size="11.5" fill="#57606a">Ambas solo aplican en la ruta heredada de bootstrap() sin argumentos; ninguna afecta a los 6 frameworks nuevos</text>

  <rect x="45" y="698" width="546" height="76" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
  <text x="61" y="719" font-size="12.5" font-weight="600" fill="#cf222e">① La cadena class_exists en Xhprof::autoDetect()</text>
  <text x="61" y="738" font-size="10.5" fill="#57606a">Un bootstrap() sin argumentos prueba 4 nombres de clase de framework:</text>
  <text x="61" y="753" font-size="10.5" fill="#57606a">\Webman\App · \Illuminate\Foundation\Application</text>
  <text x="61" y="768" font-size="10.5" fill="#57606a">\think\App · \Hyperf\Context\ApplicationContext</text>

  <rect x="611" y="698" width="546" height="76" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
  <text x="627" y="719" font-size="12.5" font-weight="600" fill="#cf222e">② El aislamiento de corrutinas de Hyperf hardcodeado en Xhprof</text>
  <text x="627" y="738" font-size="10.5" fill="#57606a">Xhprof::$_hyperf + markHyperfContext()</text>
  <text x="627" y="753" font-size="10.5" fill="#57606a">→ \Hyperf\Context\Context::set()/get() guarda los 5 adaptadores</text>
  <text x="627" y="768" font-size="10.5" fill="#57606a">El único código de Core que nombra una clase de framework directamente</text>

  <rect x="44" y="792" width="1112" height="42" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="600" y="812" font-size="12.5" font-weight="600" fill="#cf222e" text-anchor="middle">Los 6 frameworks nuevos nunca pasan por autoDetect</text>
  <text x="600" y="829" font-size="11.5" fill="#24292f" text-anchor="middle">Todos usan inyección explícita: Xhprof::bootstrap($req, $res, $cfg, $cache, $log)</text>
