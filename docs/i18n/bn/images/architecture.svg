  <text x="61" y="753" font-size="10.5" fill="#57606a">\Webman\App · \Illuminate\Foundation\Application</text>
  <text x="61" y="768" font-size="10.5" fill="#57606a">\think\App · \Hyperf\Context\ApplicationContext</text>

  <rect x="611" y="698" width="546" height="76" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
  <text x="627" y="719" font-size="12.5" font-weight="600" fill="#cf222e">② Xhprof-এ হার্ডকোড করা Hyperf করুটিন আইসোলেশন</text>
  <text x="627" y="738" font-size="10.5" fill="#57606a">Xhprof::$_hyperf + markHyperfContext()</text>
  <text x="627" y="753" font-size="10.5" fill="#57606a">→ \Hyperf\Context\Context::set()/get() ৫টি অ্যাডাপ্টার ধরে রাখে</text>
  <text x="627" y="768" font-size="10.5" fill="#57606a">Core-এ সরাসরি ফ্রেমওয়ার্ক ক্লাসের নাম উল্লেখ করা একমাত্র কোড</text>

