  <text x="1156" y="390" font-size="11.5" fill="#57606a" text-anchor="end">Core এই ৫টি মুখের মাধ্যমেই ফ্রেমওয়ার্কে পৌঁছায়; এগুলো বাস্তবায়ন করে প্রতিটি ফ্রেমওয়ার্কের নিজস্ব Adapter/ ডিরেক্টরি</text>

