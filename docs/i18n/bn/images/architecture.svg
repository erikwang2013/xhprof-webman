    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="870" fill="#f6f8fa"/>

  <!-- ============ 标题 ============ -->
  <text x="32" y="44" font-size="22" font-weight="700" fill="#24292f">XHProf Webman স্তরভিত্তিক আর্কিটেকচার</text>
  <text x="32" y="70" font-size="13" fill="#57606a">১০টি ফ্রেমওয়ার্ক এন্ট্রি → ৫টি চুক্তি → ১টি Core: নতুন ফ্রেমওয়ার্ক Core-কে ছোঁয় না</text>

