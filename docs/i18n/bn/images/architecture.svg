  <text x="600" y="829" font-size="11.5" fill="#24292f" text-anchor="middle">সবগুলোই স্পষ্ট ইনজেকশন ব্যবহার করে: Xhprof::bootstrap($req, $res, $cfg, $cache, $log)</text>
