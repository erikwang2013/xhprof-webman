  <text x="907" y="206" font-size="11" fill="#57606a" direction="ltr">Hyperf\Middleware</text>
  <rect x="1098" y="166" width="48" height="18" rx="9" fill="#1a7f37"/>
  <text x="1122" y="179" font-size="10.5" fill="#ffffff" text-anchor="middle">مدعوم</text>

  <text x="44" y="248" font-size="12" font-weight="600" fill="#0969da" text-anchor="end">6 أطر جديدة في هذا الإصدار</text>

  <!-- 新增 6 个 -->
  <rect x="44" y="254" width="172" height="64" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="56" y="279" font-size="13" font-weight="600" fill="#24292f" direction="ltr">Yii3</text>
  <text x="56" y="300" font-size="10.5" fill="#57606a" direction="ltr">Yii3\XhprofMiddleware</text>
  <rect x="164" y="261" width="44" height="17" rx="8.5" fill="#0969da"/>
