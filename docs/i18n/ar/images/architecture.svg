  <text x="341" y="206" font-size="11" fill="#57606a" direction="ltr">Laravel\Middleware</text>
  <rect x="532" y="166" width="48" height="18" rx="9" fill="#1a7f37"/>
  <text x="556" y="179" font-size="10.5" fill="#ffffff" text-anchor="middle">مدعوم</text>

