<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" width="1200" height="870" role="img" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" direction="rtl">
  <title>بنية XHProf Webman الطبقية</title>
  <desc>ثلاث طبقات: الطبقة العليا هي فئات مدخل الأطر العشر (4 مدعومة أصلًا + 6 جديدة في هذا الإصدار)، والوسطى هي الواجهات الخمس في src/Core/Contract/، والسفلى هي فئات Core الخمس. ويُبرز الشريط الأحمر في الأسفل موضعي الاقتران الوحيدين الباقيين مع الأطر، مع التنبيه إلى أن الأطر الستة الجديدة لا تمرّ عبر autoDetect بل تستخدم الحقن الصريح عبر Xhprof::bootstrap()‎. ترجمة آلية غير مُراجَعة. هذا المستند تُرجم آليًا ولم يُراجعه متحدث أصلي بالعربية، وقد يحمل أخطاء في المعنى والمصطلحات. النسخة الإنجليزية هي المرجع المعتمد: README.EN.md.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="870" fill="#f6f8fa"/>

  <!-- ============ 标题 ============ -->
  <text x="32" y="44" font-size="22" font-weight="700" fill="#24292f" text-anchor="end">بنية XHProf Webman الطبقية</text>
  <text x="32" y="70" font-size="13" fill="#57606a" text-anchor="end">10 مداخل أطر → 5 عقود → 1 نواة: الأطر الجديدة لا تمسّ Core</text>

  <!-- 图例 -->
  <rect x="700" y="32" width="18" height="18" rx="4" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <text x="726" y="46" font-size="12.5" fill="#57606a" text-anchor="end">4 مدعومة</text>
  <rect x="830" y="32" width="18" height="18" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="856" y="46" font-size="12.5" fill="#57606a" text-anchor="end">6 جديدة</text>

  <!-- ============ ① 框架入口层 ============ -->
  <rect x="24" y="100" width="1152" height="236" rx="12" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/>
  <text x="44" y="128" font-size="14" font-weight="600" fill="#24292f" text-anchor="end">① طبقة مداخل الأطر — 10 فئات مدخل</text>
  <text x="1156" y="128" font-size="11.5" fill="#57606a" text-anchor="start">أسماء الفئات تحذف بادئة مساحة الأسماء ErikWang2013\Xhprof\‎</text>

  <text x="44" y="152" font-size="12" font-weight="600" fill="#1a7f37" text-anchor="end">4 أطر مدعومة أصلًا</text>

  <!-- 已适配 4 个：webman -->
  <rect x="44" y="158" width="263" height="64" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="58" y="184" font-size="15" font-weight="600" fill="#24292f" direction="ltr">webman</text>
  <text x="58" y="206" font-size="11" fill="#57606a" direction="ltr">Webman\XhprofMiddleware</text>
