  <rect x="232" y="254" width="172" height="64" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="244" y="279" font-size="13" font-weight="600" fill="#24292f" direction="ltr">Symfony</text>
  <text x="244" y="300" font-size="10.5" fill="#57606a" direction="ltr">Symfony\XhprofListener</text>
  <rect x="352" y="261" width="44" height="17" rx="8.5" fill="#0969da"/>
  <text x="374" y="273.5" font-size="10" fill="#ffffff" text-anchor="middle">جديد</text>

  <rect x="420" y="254" width="172" height="64" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="432" y="279" font-size="13" font-weight="600" fill="#24292f" direction="ltr">Slim 4</text>
  <text x="432" y="300" font-size="10.5" fill="#57606a" direction="ltr">Slim\XhprofMiddleware</text>
  <rect x="540" y="261" width="44" height="17" rx="8.5" fill="#0969da"/>
  <text x="562" y="273.5" font-size="10" fill="#ffffff" text-anchor="middle">جديد</text>

  <rect x="608" y="254" width="172" height="64" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="620" y="279" font-size="13" font-weight="600" fill="#24292f" direction="ltr">WordPress</text>
  <text x="620" y="300" font-size="10.5" fill="#57606a" direction="ltr">Wordpress\XhprofPlugin</text>
  <rect x="728" y="261" width="44" height="17" rx="8.5" fill="#0969da"/>
  <text x="750" y="273.5" font-size="10" fill="#ffffff" text-anchor="middle">جديد</text>

  <rect x="796" y="254" width="172" height="64" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="808" y="279" font-size="13" font-weight="600" fill="#24292f" direction="ltr">Joomla</text>
  <text x="808" y="300" font-size="10.5" fill="#57606a" direction="ltr">Joomla\Extension\Xhprof</text>
  <rect x="916" y="261" width="44" height="17" rx="8.5" fill="#0969da"/>
  <text x="938" y="273.5" font-size="10" fill="#ffffff" text-anchor="middle">جديد</text>

  <rect x="984" y="254" width="172" height="64" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="996" y="279" font-size="13" font-weight="600" fill="#24292f" direction="ltr">Drupal</text>
  <text x="996" y="300" font-size="10.5" fill="#57606a" direction="ltr">Drupal\XhprofMiddleware</text>
  <rect x="1104" y="261" width="44" height="17" rx="8.5" fill="#0969da"/>
  <text x="1126" y="273.5" font-size="10" fill="#ffffff" text-anchor="middle">جديد</text>

  <!-- ① → ② -->
  <line x1="600" y1="340" x2="600" y2="358" stroke="#57606a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="616" y="353" font-size="11.5" fill="#57606a" text-anchor="end">فئات المدخل تبني 5 من Adapter وتحقنها؛ ولا تعود Core إليها إلا عبر هذه العقود الخمسة</text>

  <!-- ============ ② 契约层 ============ -->
  <rect x="24" y="362" width="1152" height="120" rx="12" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/>
  <text x="44" y="390" font-size="14" font-weight="600" fill="#24292f" text-anchor="end">② طبقة العقود — الواجهات الخمس في src/Core/Contract/‎</text>
  <text x="1156" y="390" font-size="11.5" fill="#57606a" text-anchor="start">لا تصل Core إلى الأطر إلا عبر هذه الواجهات الخمسة؛ ويُنفّذها مجلد Adapter/‎ الخاص بكل إطار</text>

  <rect x="45" y="402" width="206" height="66" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="59" y="429" font-size="13" font-weight="600" fill="#0969da" direction="ltr">RequestInterface</text>
  <text x="59" y="452" font-size="11" fill="#57606a" text-anchor="end">8 دوال · قراءة الطلب</text>

  <rect x="271" y="402" width="206" height="66" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="285" y="429" font-size="13" font-weight="600" fill="#0969da" direction="ltr">ResponseInterface</text>
  <text x="285" y="452" font-size="11" fill="#57606a" text-anchor="end">5 دوال · كتابة الاستجابة</text>

  <rect x="497" y="402" width="206" height="66" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="511" y="429" font-size="13" font-weight="600" fill="#0969da" direction="ltr">ConfigInterface</text>
  <text x="511" y="452" font-size="11" fill="#57606a" text-anchor="end">دالة واحدة get()‎</text>

  <rect x="723" y="402" width="206" height="66" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="737" y="429" font-size="13" font-weight="600" fill="#0969da" direction="ltr">CacheInterface</text>
  <text x="737" y="452" font-size="11" fill="#57606a" text-anchor="end">9 دوال · قراءة/كتابة Redis</text>

  <rect x="949" y="402" width="206" height="66" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="963" y="429" font-size="13" font-weight="600" fill="#0969da" direction="ltr">LoggerInterface</text>
  <text x="963" y="452" font-size="11" fill="#57606a" text-anchor="end">دالة واحدة error()‎</text>

  <!-- ② → ③ -->
  <line x1="600" y1="486" x2="600" y2="504" stroke="#57606a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="616" y="499" font-size="11.5" fill="#57606a" text-anchor="end">فئات Core الخمس لا تستدعي إلا دوال الواجهات، ولا تعرف أي فئة إطار محددة</text>

  <!-- ============ ③ Core ============ -->
  <rect x="24" y="508" width="1152" height="120" rx="12" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/>
  <text x="44" y="536" font-size="14" font-weight="600" fill="#24292f" text-anchor="end">③ النواة — فئات src/Core/‎ الخمس</text>
  <text x="1156" y="536" font-size="11.5" fill="#57606a" text-anchor="start">لا import لأي فئة إطار</text>

  <rect x="45" y="548" width="206" height="66" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="59" y="572" font-size="13" font-weight="600" fill="#24292f" direction="ltr">Xhprof</text>
  <text x="59" y="590" font-size="10.5" fill="#57606a" direction="ltr">bootstrap() index() deny()</text>
  <text x="59" y="605" font-size="10.5" fill="#57606a" direction="ltr">xhprofStart() xhprofStop()</text>

  <rect x="271" y="548" width="206" height="66" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="285" y="572" font-size="13" font-weight="600" fill="#24292f" direction="ltr">XhprofProfiler</text>
  <text x="285" y="590" font-size="10.5" fill="#57606a" direction="ltr">start() stop()</text>
  <text x="285" y="605" font-size="10.5" fill="#57606a" direction="ltr">isEnabled() bootstrap()</text>

  <rect x="497" y="548" width="206" height="66" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="511" y="572" font-size="13" font-weight="600" fill="#24292f" direction="ltr">XHProfRunsDefault</text>
  <text x="511" y="590" font-size="10.5" fill="#57606a" direction="ltr">save_run() get_run()</text>
  <text x="511" y="605" font-size="10.5" fill="#57606a" text-anchor="end">list_runs()‎ · قائمة سماح run_id</text>

  <rect x="723" y="548" width="206" height="66" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="737" y="572" font-size="13" font-weight="600" fill="#24292f" direction="ltr">StaticController</text>
  <text x="737" y="590" font-size="10.5" fill="#57606a" direction="ltr">serve()</text>
  <text x="737" y="605" font-size="10.5" fill="#57606a" direction="ltr">/xhprof-assets/</text>

  <rect x="949" y="548" width="206" height="66" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="963" y="572" font-size="13" font-weight="600" fill="#24292f" direction="ltr">XhprofDisplay</text>
  <text x="963" y="590" font-size="10.5" fill="#57606a" direction="ltr">displayXHProfReport()</text>
  <text x="963" y="605" font-size="10.5" fill="#57606a" direction="ltr">xhprof_include_js_css()</text>

  <!-- ③ → ④ 红色耦合箭头 -->
  <line x1="100" y1="630" x2="100" y2="652" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="116" y="647" font-size="11.5" fill="#cf222e" text-anchor="end">كلتا الحالتين داخل Xhprof</text>

  <!-- ============ ④ 两处耦合 ============ -->
  <rect x="24" y="654" width="1152" height="200" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
  <rect x="44" y="668" width="252" height="26" rx="13" fill="#cf222e"/>
  <text x="170" y="686" font-size="10.79" font-weight="600" fill="#ffffff" text-anchor="middle">الاقترانان الباقيان مع الأطر في Core</text>
  <text x="312" y="686" font-size="11.5" fill="#57606a" text-anchor="end">كلاهما يعمل فقط على مسار bootstrap()‎ القديم بلا وسائط، ولا يمسّ الأطر الستة الجديدة</text>

  <rect x="45" y="698" width="546" height="76" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
  <text x="61" y="719" font-size="12.5" font-weight="600" fill="#cf222e" text-anchor="end">① سلسلة class_exists في Xhprof::autoDetect()‎</text>
  <text x="61" y="738" font-size="10.5" fill="#57606a" text-anchor="end">عند bootstrap()‎ بلا وسائط تُفحص أسماء فئات 4 أطر بالتتابع:</text>
  <text x="61" y="753" font-size="10.5" fill="#57606a" direction="ltr">\Webman\App · \Illuminate\Foundation\Application</text>
  <text x="61" y="768" font-size="10.5" fill="#57606a" direction="ltr">\think\App · \Hyperf\Context\ApplicationContext</text>

  <rect x="611" y="698" width="546" height="76" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
  <text x="627" y="719" font-size="12.5" font-weight="600" fill="#cf222e" text-anchor="end">② عزل كوروتين Hyperf المكتوب مباشرة داخل Xhprof</text>
  <text x="627" y="738" font-size="10.5" fill="#57606a" direction="ltr">Xhprof::$_hyperf + markHyperfContext()</text>
  <text x="627" y="753" font-size="10.5" fill="#57606a" text-anchor="end">→ يخزّن ‎\Hyperf\Context\Context::set()/get()‎ خمسة محوّلات</text>
  <text x="627" y="768" font-size="10.5" fill="#57606a" text-anchor="end">الشيفرة الوحيدة في Core التي تذكر اسم فئة إطار مباشرة</text>

  <rect x="44" y="792" width="1112" height="42" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="600" y="812" font-size="12.5" font-weight="600" fill="#cf222e" text-anchor="middle">الأطر الستة الجديدة لا تمرّ عبر autoDetect</text>
  <text x="600" y="829" font-size="11.5" fill="#24292f" text-anchor="middle">كلها تستخدم الحقن الصريح Xhprof::bootstrap($req, $res, $cfg, $cache, $log)‎</text>
</svg>
