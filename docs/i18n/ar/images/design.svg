<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" direction="rtl">
  <title>مقايضات التصميم: القرار والسبب والكلفة</title>
  <desc>مقارنة لخمسة قرارات رئيسية، يسرد كل منها القرار نفسه والمنفعة التي اشتراها والكلفة التي دفعها: Core تعتمد على 5 عقود فقط، وفئات المدخل تخدم صفحة التقرير بنفسها، ولا طبقة مشتركة مستخرجة، والبدائل الوهمية يتحقق منها حلقة تحقق مستقلة، والأطر الستة الجديدة تستخدم الحقن الصريح بدل autoDetect. ترجمة آلية غير مُراجَعة. هذا المستند تُرجم آليًا ولم يُراجعه متحدث أصلي بالعربية، وقد يحمل أخطاء في المعنى والمصطلحات. المرجع المعتمد هو النسخة الإنجليزية.</desc>

  <rect x="0" y="0" width="1200" height="640" fill="#f6f8fa"/>

  <!-- ============ 标题 ============ -->
  <text x="32" y="44" font-size="22" font-weight="700" fill="#24292f" text-anchor="end">مقايضات التصميم: القرار → السبب → الكلفة</text>
  <text x="32" y="70" font-size="13" fill="#57606a" text-anchor="end">ما اشتراه كل قرار من القرارات الخمسة، وما كلّف</text>

  <!-- 结论条 -->
  <rect x="24" y="88" width="1152" height="42" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="600" y="114" font-size="14" font-weight="600" fill="#0550ae" text-anchor="middle">تغييرات الأطر الستة الجديدة على src/Core/‎ = 0</text>

  <!-- ============ 表头 ============ -->
  <rect x="24" y="146" width="376" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="38" y="157" width="10" height="10" rx="2" fill="#0969da"/>
  <text x="56" y="168" font-size="12.5" font-weight="600" fill="#0969da" text-anchor="end">القرار · ما اخترناه</text>

  <rect x="412" y="146" width="376" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="426" y="157" width="10" height="10" rx="2" fill="#1a7f37"/>
  <text x="444" y="168" font-size="12.5" font-weight="600" fill="#1a7f37" text-anchor="end">السبب · ما اشتراه</text>

  <rect x="800" y="146" width="376" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="814" y="157" width="10" height="10" rx="2" fill="#bc4c00"/>
  <text x="832" y="168" font-size="12.5" font-weight="600" fill="#bc4c00" text-anchor="end">الكلفة · ما كلّف</text>

  <!-- ============ 第 1 行：Core 只依赖 5 个契约 ============ -->
  <rect x="24" y="182" width="376" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="40" y="204" font-size="12.5" font-weight="600" fill="#0550ae" text-anchor="end">Core تعتمد على واجهات العقود الخمسة فقط</text>
  <text x="40" y="224" font-size="11" fill="#24292f" text-anchor="end">src/Core/‎ لا import فيها إلا لتلك الواجهات الخمس،</text>
  <text x="40" y="240" font-size="11" fill="#24292f" text-anchor="end">ولا import لأي فئة إطار</text>

  <rect x="412" y="182" width="376" height="80" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="428" y="204" font-size="12.5" font-weight="600" fill="#1a7f37" text-anchor="end">إضافة إطار = إضافة مجلد واحد</text>
  <text x="428" y="224" font-size="11" fill="#24292f" text-anchor="end">الأطر الستة الجديدة تغيّر 0 سطر في src/Core/‎؛‎</text>
  <text x="428" y="240" font-size="11" fill="#24292f" text-anchor="end">وسلوك Webman/Laravel غير متأثر أيضًا</text>

  <rect x="800" y="182" width="376" height="80" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="816" y="204" font-size="12.5" font-weight="600" fill="#bc4c00" text-anchor="end">العقد نفسه منفَّذ 11 مرات</text>
  <text x="816" y="224" font-size="11" fill="#24292f" text-anchor="end">كل إطار من الأطر الأحد عشر يكتب 5 من Adapter،</text>
  <text x="816" y="240" font-size="11" fill="#24292f" text-anchor="end">العقد ثابت لكن الشيفرة تُعاد كتابتها مرارًا</text>

  <!-- ============ 第 2 行：入口类自服务报告页 ============ -->
  <rect x="24" y="272" width="376" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="40" y="294" font-size="12.5" font-weight="600" fill="#0550ae" text-anchor="end">فئات المدخل تخدم صفحة التقرير بنفسها</text>
  <text x="40" y="314" font-size="11" fill="#24292f" text-anchor="end">فئة المدخل تفحص المسار قبل start؛ فإن أصابت صفحة التقرير</text>
  <text x="40" y="330" font-size="11" fill="#24292f" text-anchor="end">عادت فورًا بـ withBody(Xhprof::index())-&gt;send()‎</text>

  <rect x="412" y="272" width="376" height="80" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="428" y="294" font-size="12.5" font-weight="600" fill="#1a7f37" text-anchor="end">يُلغي 3 مهام لكل إطار</text>
  <text x="428" y="314" font-size="11" fill="#24292f" text-anchor="end">لا متحكم تكتبه، ولا مسار لصفحة التقرير تسجّله،</text>
  <text x="428" y="330" font-size="11" fill="#24292f" text-anchor="end">ولا مسار للموارد تسجّله</text>

  <rect x="800" y="272" width="376" height="80" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="816" y="294" font-size="12.5" font-weight="600" fill="#bc4c00" text-anchor="end">منطق التجاوز المبكر مكرر 11 مرات</text>
  <text x="816" y="314" font-size="9.62" fill="#24292f" text-anchor="end">وهذه الثلاثة بالذات هي ما يختبئ فيه التخمين الخاطئ عن الاختبارات،</text>
  <text x="816" y="330" font-size="11" fill="#24292f" text-anchor="end">فالتكرار يشتري اليقين (وحدة Drupal القياسية استثناء)</text>

  <!-- ============ 第 3 行：不抽共享层 ============ -->
  <rect x="24" y="362" width="376" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="40" y="384" font-size="12.5" font-weight="600" fill="#0550ae" text-anchor="end">لا طبقة مشتركة مستخرجة</text>
  <text x="40" y="404" font-size="11" fill="#24292f" text-anchor="end">PSR-7 (Yii3 / Slim) و HttpFoundation</text>
  <text x="40" y="420" font-size="10.42" fill="#24292f" text-anchor="end">(Symfony / Drupal) لهما الشكل نفسه، ومع ذلك يُنفَّذ كل منهما على حدة</text>

  <rect x="412" y="362" width="376" height="80" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="428" y="384" font-size="12.5" font-weight="600" fill="#1a7f37" text-anchor="end">الأطر تبقى معزولة تمامًا</text>
  <text x="428" y="404" font-size="11" fill="#24292f" text-anchor="end">فتغيير محوّل إطار لا يصل إلى إطار آخر،</text>
  <text x="428" y="420" font-size="11" fill="#24292f" text-anchor="end">وتبقى تعارضات الملفات المشتركة في حدها الأدنى</text>

  <rect x="800" y="362" width="376" height="80" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="816" y="384" font-size="12.5" font-weight="600" fill="#bc4c00" text-anchor="end">نحو 30 محوّلًا شبه مكرر</text>
  <text x="816" y="404" font-size="11" fill="#24292f" text-anchor="end">التكرار حساب ظاهر، والانحراف حساب خفي —</text>
  <text x="816" y="420" font-size="11" fill="#24292f" text-anchor="end">واختبارات parity تحوّل الانحراف إلى ضوء أحمر</text>

  <!-- ============ 第 4 行：桩由独立验证环校验 ============ -->
  <rect x="24" y="452" width="376" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="40" y="474" font-size="12.5" font-weight="600" fill="#0550ae" text-anchor="end">البدائل الوهمية يتحقق منها حلقة تحقق مستقلة</text>
  <text x="40" y="494" font-size="11" fill="#24292f" text-anchor="end">فمن يكتب محوّلًا لا يكتب البدائل الوهمية التي يعتمد عليها،</text>
  <text x="40" y="510" font-size="11" fill="#24292f" text-anchor="end">وتُفحص البدائل والتواقيع والدلالات باستقلال</text>

  <rect x="412" y="452" width="376" height="80" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="428" y="474" font-size="12.5" font-weight="600" fill="#1a7f37" text-anchor="end">وهذا يكسر الحجة الدائرية</text>
  <text x="428" y="494" font-size="11" fill="#24292f" text-anchor="end">وإلا كرّس البديل الوهمي تخمين كاتبه عن API الإطار:</text>
  <text x="428" y="510" font-size="9.22" fill="#24292f" text-anchor="end">اختبارات الوحدة كلها خضراء، وعلى الجهاز الحقيقي Call to undefined method</text>

  <rect x="800" y="452" width="376" height="80" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="816" y="474" font-size="12.5" font-weight="600" fill="#bc4c00" text-anchor="end">عمق التحقق غير متساوٍ</text>
  <text x="816" y="494" font-size="11" fill="#24292f" text-anchor="end">دلالات L2 تغطي 4.5/6؛ أما WordPress فلا يمكن تغطيته،</text>
  <text x="816" y="510" font-size="11" fill="#24292f" text-anchor="end">ولا يبقى إلا فحص نص الشيفرة واختبار دخاني يدوي</text>

  <!-- ============ 第 5 行：显式注入而非 autoDetect ============ -->
  <rect x="24" y="542" width="376" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="40" y="564" font-size="12.5" font-weight="600" fill="#0550ae" text-anchor="end">حقن صريح بدل autoDetect</text>
  <text x="40" y="584" font-size="11" fill="#24292f" text-anchor="end">الأطر الستة الجديدة كلها تستخدم الحقن الصريح:</text>
  <text x="40" y="600" font-size="11" fill="#24292f" direction="ltr">Xhprof::bootstrap($req, $res, $cfg, $cache, $log)</text>

  <rect x="412" y="542" width="376" height="80" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="428" y="564" font-size="12.5" font-weight="600" fill="#1a7f37" text-anchor="end">يقتل الفرع الذي لا يمكن أن يعمل أبدًا</text>
  <text x="428" y="584" font-size="11" fill="#24292f" text-anchor="end">اسم فئة فحص مكتوب خطأ → الفرع لا يعمل أبدًا؛</text>
  <text x="428" y="600" font-size="11" fill="#24292f" text-anchor="end">وقد وقع فرع Hyperf في هذا المستودع في هذا الفخ مرة</text>

  <rect x="800" y="542" width="376" height="80" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="816" y="564" font-size="12.5" font-weight="600" fill="#bc4c00" text-anchor="end">فئات المدخل تجمع محوّلاتها بنفسها</text>
  <text x="816" y="584" font-size="11" fill="#24292f" text-anchor="end">Core لم تعد تفحص نيابة عنها؛ كل فئة مدخل تكتب بنفسها</text>
  <text x="816" y="600" font-size="11" fill="#24292f" text-anchor="end">نحو 30 سطرًا (منها 5 إنشاءات محوّلات)</text>
</svg>
