name: Contracts

# 契约验证环：用**真实** PSR 包校验 tests/Stubs 里的框架桩。
# 与 ci.yml 分开是刻意的：环需要一台装了真实包的机器（`tools/contracts/vendor`），
# 而 ci.yml 的 test job 跑的是零运行依赖的单测，两者的失败含义完全不同。
# 也因此 `tools/` 不进 ci.yml 的 `find src tests` —— ci.yml 保持零改动。
#
# 三条腿（matrix）：README 声明 Symfony 支持 `^6.4|^7.0`，而一个 composer 项目里装不下两版
# （laravel/framework 12+ 要求 symfony/http-foundation ^7.2），所以 6.4 那条腿是**独立嵌套
# 项目** tools/contracts/legacy-symfony64，跑的是同一份 cases/Symfony.php —— run.php
# `--leg=symfony64` 只把 vendor 根换过去，不复制 case 文件。第三条腿 legacy-symfony8 同形，
# 装 Symfony 8.1 + Laravel 13（跑 Symfony.php + Laravel.php）：Symfony 8 删掉了
# `Request::get()`（7.4 弃用、8.0 移除）而本包 Laravel 适配器正在用它，这个差异只在真 8.x 上
# 看得见；Symfony 8 要求 PHP >= 8.4.1，所以 php 进了 matrix **逐腿给**（前两条腿仍是 8.3）。
# 三条腿都必须在：只跑 7.x 时，一条只在 6.4 上不成立的断言（6.4 的属性没有原生类型声明、
# prepare() 补的 charset 大小写不同）永远不会被看见 —— 上一轮就是靠手工探针才抓到的；
# 8.x 同理（getSubscribedEvents() 的返回类型 8.0 起变成 array，第一次跑 8 腿就红在这）。

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 连续推送时旧的一轮没有意义却要占 runner（契约环还要装两套 composer
# 依赖）。group 含 workflow 名 + ref：不同 workflow 互不取消，同一 ref 新轮取消旧轮。
# 写法与 release.yml:16 一致 —— 唯一刻意不同的是 release 的 cancel-in-progress: false
# （发版那轮被连推取消会错版），别顺手统一。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: 契约验证环（${{ matrix.leg }}）
    runs-on: ubuntu-latest

    strategy:
      # 一条腿红不取消另一条：两条腿的结论要各自看得到。掩盖另一条腿的结论，
      # 等于少跑一条腿。
      fail-fast: false
      matrix:
        include:
          # 主腿：cases/*.php 全部，用 tools/contracts/vendor（当前 Laravel 12 + Symfony 7.4 线）。
          - leg: main
            install_dir: tools/contracts
            # 与 6.4 腿同为 8.3：tools/contracts 的两个 composer.json 都要求 php >= 8.2，
            # 不写死版本的话 runner 默认 PHP 变了会变成"环在某天开始失败"的噪声。
            php: '8.3'
          # 第二腿：Symfony 6.4 线，只跑 Symfony.php（别的 case 与 Symfony 的版本矩阵无关，
          # 主腿已用各自的最新包跑过）。它没装 symfony/mime，于是恰好走到 MIME 陷阱的**另一
          # 条分支**（不钉 Content-Type 时 prepare() 直接抛 LogicException）—— 与主腿的
          # 「有 mime、按内容嗅探」互补，两条腿合起来才把那个陷阱的两个分支都钉住。
          - leg: symfony64
            install_dir: tools/contracts/legacy-symfony64
            php: '8.3'
          # 第三腿：Symfony 8.1 + Laravel 13（跑 Symfony.php + Laravel.php）。php 只能 8.4.1+：
          # Symfony 8 的硬门槛（8.0 线 >= 8.4，8.1 线 >= 8.4.1，composer.json 里如实写死），
          # 选 8.5 的理由：与本仓开发机（PHP 8.5.6）同一条线，且 ci.yml 的 test
          # matrix 里本就有 8.5 —— 不是引入一条没人测过的版本线。这条腿的 vendor 同时装了
          # symfony/mime（Laravel 13 传递依赖），所以它走的是「有 mime、按内容嗅探」那条分支，
          # 与 6.4 腿的无 mime 分支互补（两条都不是 skip：case 里两种环境各有一条真断言）。
          - leg: symfony8
            install_dir: tools/contracts/legacy-symfony8
            php: '8.5'

    # cases/Redis.php 是**真 Redis 端到端**（业务请求 → 落库 → 报告页读回），前置就是
    # 127.0.0.1:6379 上有一个真服务器。用 service container 而不是 step 里现装：
    # 生命周期跟着 job 走，且 health-cmd 保证跑 case 时它**已经在监听**——那个 case
    # 连不上时是 FAIL 不是 SKIP（SKIP 数是冻结常量，不许随环境漂移）。
    # service 是 job 级的、两条腿共用这一份定义：6.4 腿只跑 Symfony.php 用不到 redis，
    # 但删掉它主腿那个 case 就必然 FAIL，所以这里对两条腿都保留。
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          # 逐腿给 php（matrix.php），不是全局一个：主腿与 6.4 腿仍是 8.3（两个
          # tools/contracts*/composer.json 都要求 php >= 8.2，对齐 ci.yml 的 test job），
          # 而 symfony8 腿的 Symfony 8 硬门槛是 >= 8.4.1。不写死版本的话，runner 默认
          # PHP 变了会变成"环在某天开始失败"的噪声。
          php-version: ${{ matrix.php }}
          # 必须显式装 xhprof（与 ci.yml 一致）。理由不是"多测一点"：几个 case 在缺
          # ext-xhprof 时会把采样类断言**诚实地计入 SKIP**而不是静默通过，于是
          # run.php 的 SKIP 总数会随环境漂移（三条腿的冻结值合计 2：main 2 / symfony64 0 /
          # symfony8 0；缺扩展时仅 Symfony 一个 case 就会多出 36——该 case 的 no-ext 守卫
          # 此前是死码、缺扩展会 fatal，2026-10-04 修好后此表才成立），而三条腿的期望 SKIP
          # 都是冻结常量 —— 它们一旦随环境变化，这道签字闸门就失去意义。
          extensions: xhprof, redis
          coverage: none
      # 与 release.yml 的契约腿缓存**同名同键**（同一份 composer.lock、同一个 vendor 路径）：
      # 两份 workflow 并行触发，先跑完的那个暖缓存，另一个直接命中 —— 键若各自起名，
      # 同一份依赖会在同一次 push 里被下载两遍。三条腿的路径不同，故拆成三条带 if 的
      # 步骤，键与 release.yml 那三条逐字一致（改一处就得两处一起改）。
      - name: Cache main-leg contract vendor
        if: matrix.leg == 'main'
        uses: actions/cache@v6
        with:
          path: tools/contracts/vendor
          key: composer-contracts-main-${{ hashFiles('tools/contracts/composer.lock') }}
      - name: Cache Symfony 6.4-leg contract vendor
        if: matrix.leg == 'symfony64'
        uses: actions/cache@v6
        with:
          path: tools/contracts/legacy-symfony64/vendor
          key: composer-contracts-symfony64-${{ hashFiles('tools/contracts/legacy-symfony64/composer.lock') }}
      - name: Cache Symfony 8-leg contract vendor
        if: matrix.leg == 'symfony8'
        uses: actions/cache@v6
        with:
          path: tools/contracts/legacy-symfony8/vendor
          key: composer-contracts-symfony8-${{ hashFiles('tools/contracts/legacy-symfony8/composer.lock') }}
      # 故意**不加** --ignore-platform-reqs：PHP 或扩展不满足时这里就该炸，
      # 而不是装出一套残缺依赖让环在下面假装通过。
      # 三腿各自 install 自己那份 composer.lock（都在仓库里），所以"这条腿装了什么"
      # 是可复核的，不会随上游发包漂移。
      - name: Install contract dependencies
        run: composer install -d ${{ matrix.install_dir }} --no-interaction --prefer-dist
      # 环自带四道闸：任一 FAIL 非零退出；SKIP 数必须等于**该腿**的冻结常量（否则"验不过
      # 就标 skip"会静默变绿）；腿的版本身份要与它自己的 composer.lock 相符（否则 6.4 腿
      # 的 vendor 被换成 7.x 时会悄悄变成主腿的副本）；某个 case 加载期崩溃时仍会打印
      # 其余 case 的结论。腿名写错是直接报错，不会静默回落到主腿。
      - name: Run contract checks
        run: php tools/contracts/run.php --leg=${{ matrix.leg }}
