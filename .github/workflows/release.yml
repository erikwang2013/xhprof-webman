name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '强制版本号（如 v3.1.0）。留空则基于最新 tag 自动递增 patch'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 本 workflow 与 ci.yml 并行触发，且没有 needs: 依赖。
      # 不自己先跑一遍测试的话，一个测试全红的提交照样会被打 tag 并发 Release，
      # Packagist 随之发布坏版本。
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # dom, mbstring 与 i18n.yml 对齐：tools/i18n/check.php 用 DOMDocument 解析
          # SVG、用 mbstring 量字数与宽度。i18n.yml 显式列了这两个，这里跟着列 ——
          # 已装载的扩展再列一次是空操作，少列一个是"本地能跑、runner 上必红"。
          extensions: redis, xhprof, dom, mbstring
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-reqs
      - name: Unit tests must pass before tagging
        run: vendor/bin/phpunit --no-coverage

      # 上面那段注释只说了单测——但契约环（contracts.yml）与 i18n 门禁（i18n.yml）
      # 的 on: 同样只挂 main push，与本 workflow 并行且无 needs: 依赖。于是
      # 「提交只破坏契约环」或「只破坏某语言的门禁」时，tag 与 Release 照常产生，
      # Packagist 随之发布坏版本。两道门禁在 tag 之前补跑（下面的命令与那两个
      # workflow 逐字一致，只是不再按 workflow 隔离）。
      - name: Contract checks must pass before tagging
        # 故意不加 --ignore-platform-reqs（与 contracts.yml 一致）：PHP 或扩展不满足时
        # 这里就该炸，而不是装出一套残缺依赖让环在下面假装通过。本 job 的 PHP 8.3 与
        # xhprof/redis 已满足 tools/contracts/composer.json 的 php >= 8.2 与扩展要求。
        run: |
          composer install -d tools/contracts --no-interaction --prefer-dist
          php tools/contracts/run.php
      - name: Every locale must pass its own gate before tagging
        # 语言清单与 i18n.yml 的 for 列表逐字一致；两条清单都由
        # tests/Unit/Docs/I18nWorkflowTest.php 与 I18n::AVAILABLE 机械对齐，
        # 所以这里不引入第二份"无人看守的手写清单"。
        run: |
          for lang in en ko ru de fr es pt ar hi bn id ja; do
            echo "::group::$lang"
            php tools/i18n/check.php --lang="$lang"
            echo "::endgroup::"
          done

      - name: Compute next version
        id: version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            NEW_VERSION="$INPUT_VERSION"
          else
            LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            if [ -z "$LATEST" ]; then
              NEW_VERSION="v0.1.0"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
              # 递增哪一位由**提交类型**决定，不是恒递增 patch。
              # 恒 patch 会把一个 feature 级变更（如「新增 6 个框架兼容」）压成
              # v3.0.7，而包使用者看 semver 判断该不该升。规则即 Conventional
              # Commits：`type!:` 或 `BREAKING CHANGE` → major；`feat` → minor；
              # 其余（fix/docs/chore/test/refactor…）→ patch。
              RANGE="${LATEST}..HEAD"
              SUBJECTS=$(git log "$RANGE" --format='%s' 2>/dev/null || echo '')
              BODIES=$(git log "$RANGE" --format='%b' 2>/dev/null || echo '')
              if echo "$SUBJECTS" | grep -qE '^[a-z]+(\([^)]+\))?!:' || echo "$BODIES" | grep -q 'BREAKING CHANGE'; then
                NEW_VERSION="v$((MAJOR + 1)).0.0"
              elif echo "$SUBJECTS" | grep -qE '^feat(\([^)]+\))?:'; then
                NEW_VERSION="v$MAJOR.$((MINOR + 1)).0"
              else
                NEW_VERSION="v$MAJOR.$MINOR.$((PATCH + 1))"
              fi
              echo "自 $LATEST 起的提交类型判定 → $NEW_VERSION"
              git log "$RANGE" --format='  %s' | head -20
            fi
          fi
          if ! echo "$NEW_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version: $NEW_VERSION" >&2
            exit 1
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.version }}" --generate-notes --title "${{ steps.version.outputs.version }}"
