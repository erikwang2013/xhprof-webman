name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '强制版本号（如 v3.1.0）。留空则基于最新 tag 自动递增 patch'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  # ci.yml 的 8.0 腿与 release.yml 并行触发、互相没有 needs: 依赖 —— 8.0 腿红，
  # tag 与 Release 照常产生。把它复制成 release 的前置 job：`needs: php80` 让
  # release job（以及其中打 tag 的那一步）在 8.0 没跑绿时根本不会启动。
  # 只取 8.0 这一格：语法检查单调（8.0 解析器接受的，8.2/8.4/8.5 全部接受），更高
  # 版本不带来新信息；单测下限由 release job 自己的 PHP 8.3 phpunit 覆盖。
  # 步骤与 ci.yml 的 8.0 侧逐字对应：lint job 的 "Lint all PHP files"（扫描面与 ci 相同，
  # 含 tools/i18n）；smoke job 的 "No post-8.0 functions in shipped PHP"、"Generate autoloader"、
  # "Load shipped classes and exercise pure logic"（autoloader 是类加载步的前置）。
  # 类加载步不能省：只有 lint + 黑名单时，「语法过、函数名过、类加载/纯逻辑即崩」的提交
  # 照样会被打 tag —— 这正是本 job 存在的理由。
  php80:
    name: PHP 8.0 gate before tagging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: redis, xhprof
          coverage: none
      - name: Lint all PHP files
        run: find src tests joomla wordpress tools/i18n -name '*.php' -print0 | xargs -0 -n1 php -l
      # 只生成 autoloader。不能写 composer install --no-dev：--no-dev 并不会让
      # composer 跳过 require-dev 的依赖求解（官方原话：no-dev 只代表不安装），
      # 而 phpunit/phpunit ^11.5 要求 php >= 8.2，在 8.0/8.1 上解析阶段就直接失败。
      # 本项目 require 里没有任何包（仅 php + 两个扩展），故只需 autoloader；
      # dump-autoload 不做依赖求解，正合此处所需。
      - name: Generate autoloader
        run: composer dump-autoload --no-interaction
      - name: No post-8.0 functions in shipped PHP
        run: |
          if grep -rnE '\b(array_is_list|enum_exists|array_find|array_any|array_all|json_validate|mb_str_pad|ini_parse_quantity|memory_reset_peak_usage|mb_ucfirst|mb_lcfirst)[[:space:]]*\(' src/ joomla/ wordpress/ --include='*.php'; then
            echo "::error::src/ joomla/ wordpress/ 使用了 PHP 8.1+ 才提供的函数，与 composer.json 的 php >= 8.0 不符"
            exit 1
          fi
      - name: Load shipped classes and exercise pure logic
        run: |
          php -r '
          require "vendor/autoload.php";
          $ns = "ErikWang2013\\Xhprof\\";
          $classes = [
            "Core\\Xhprof",
            "Core\\XhprofProfiler",
            "Core\\StaticController",
            "Core\\Analysis\\Analyzer",
            "Core\\Analysis\\Finding",
            "Core\\XhprofLib\\Utils\\XhprofLib",
            "Core\\XhprofLib\\Utils\\XHProfRunsDefault",
            "Core\\XhprofLib\\Display\\XhprofDisplay",
          ];
          foreach ($classes as $c) {
            if (!class_exists($ns . $c)) { fwrite(STDERR, "cannot load {$ns}{$c}\n"); exit(1); }
          }
          $lib  = $ns . "Core\\XhprofLib\\Utils\\XhprofLib";
          $disp = $ns . "Core\\XhprofLib\\Display\\XhprofDisplay";
          if (count($lib::xhprof_get_possible_metrics()) !== 7) { exit(1); }
          if ($disp::xhprof_count_format(1234) !== "1,234") { exit(1); }
          echo "runtime smoke ok on ", PHP_VERSION, "\n";
          '

  release:
    needs: php80
    runs-on: ubuntu-latest
    # 与 contracts.yml 同一个 service：cases/Redis.php 是真 Redis 端到端（连不上就 FAIL）。
    # 两份 workflow 各自触发、各自跑环，缺一份就等于那条路必然红。
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 本 workflow 与 ci.yml 并行触发，且没有 needs: 依赖。
      # 不自己先跑一遍测试的话，一个测试全红的提交照样会被打 tag 并发 Release，
      # Packagist 随之发布坏版本。
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # dom, mbstring 与 i18n.yml 对齐：tools/i18n/check.php 用 DOMDocument 解析
          # SVG、用 mbstring 量字数与宽度。i18n.yml 显式列了这两个，这里跟着列 ——
          # 已装载的扩展再列一次是空操作，少列一个是"本地能跑、runner 上必红"。
          extensions: redis, xhprof, dom, mbstring
          coverage: none
      # 与 ci.yml 的 test job **刻意共享同一键**（`composer-root` + 根 composer.json 的 hash）：
      # 两边装的是同一份根依赖（phpunit 及其依赖树），同一键 = 谁先跑谁暖、另一个直接命中。
      # 改键时两处一起改，不然同一次 push 里这份依赖会被下载两遍。
      # 键跟 composer.json 不跟锁：根项目刻意不提交锁（.gitignore 的 /composer.lock，库的
      # 惯例），checkout 里没有锁文件 —— 原先 hashFiles('composer.lock') 恒为空串、键退化成
      # 常量。无锁时 composer install 是 update 语义（每次现解整棵树），缓存只省下载、不会
      # 喂出错误依赖集（composer 与缓存带回来的 installed.json 对账）。边界与 ci.yml 同：
      # 键反映约束不反映解析，11.x 补丁漂移不改键（策略：dev 工具链跟当前 11.x，炸 CI 不炸
      # 使用者的包），且 minimum-stability: dev + prefer-stable: true 下极端情况可解析到 dev 版本。
      # 键不含 PHP 版本的理由与 ci.yml 相同：纯 PHP 依赖，8.3 与 8.2/8.4/8.5 装的字节级相同。
      - name: Cache composer vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-root-${{ hashFiles('composer.json') }}
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-reqs
      - name: Unit tests must pass before tagging
        run: vendor/bin/phpunit --no-coverage

      # 上面那段注释只说了单测——但契约环（contracts.yml）与 i18n 门禁（i18n.yml）
      # 的 on: 同样只挂 main push，与本 workflow 并行且无 needs: 依赖。于是
      # 「提交只破坏契约环」或「只破坏某语言的门禁」时，tag 与 Release 照常产生，
      # Packagist 随之发布坏版本。两道门禁在 tag 之前补跑（下面的命令与那两个
      # workflow 逐字一致，只是不再按 workflow 隔离）。
      # 两条腿，与 contracts.yml 的 matrix 同一组：README 声明 Symfony 支持 `^6.4|^7.0`，
      # 而一个 composer 项目里装不下两版（laravel/framework v11 要 symfony/http-foundation
      # ^7.2），所以 6.4 是**独立嵌套项目** tools/contracts/legacy-symfony64，跑的是同一份
      # cases/Symfony.php（`--leg=symfony64` 只换 vendor 根，不复制 case）。
      # **两条腿都必须在 tag 之前过**：只留 7.x 那条，这道门禁就漏掉半个矩阵 —— 而上一轮
      # 正是靠 6.4 才抓出两条只在 7.4 上成立的过拟合断言。
      # 两条契约腿各装一次 vendor（main 腿的 lock 375KB，6.4 腿 35KB）。缓存键就是
      # 对应锁文件的 hash：lock 没动就不重装，lock 一动键就变、必然重装。
      - name: Cache main-leg contract vendor
        uses: actions/cache@v4
        with:
          path: tools/contracts/vendor
          key: composer-contracts-main-${{ hashFiles('tools/contracts/composer.lock') }}
      - name: Contract checks must pass before tagging（main 腿）
        # 故意不加 --ignore-platform-reqs（与 contracts.yml 一致）：PHP 或扩展不满足时
        # 这里就该炸，而不是装出一套残缺依赖让环在下面假装通过。本 job 的 PHP 8.3 与
        # xhprof/redis 已满足 tools/contracts/composer.json 的 php >= 8.2 与扩展要求。
        # cases/Redis.php 是真 Redis 端到端，前置就是 127.0.0.1:6379 上有个真服务器；
        # 它连不上时是 FAIL 不是 SKIP（SKIP 数是冻结常量）。所以这里必须与 contracts.yml
        # 用同一个 service 容器 —— 少这一块，环会在 tag 之前必然失败、Release 永远发不出去。
        run: |
          composer install -d tools/contracts --no-interaction --prefer-dist
          php tools/contracts/run.php --leg=main
      # if: always() 不是装饰：main 腿红的时候这条腿**仍然要跑**并打印自己的结论，不然
      # 一条腿的红会把另一条腿的结论盖掉（掩盖结论等于少跑一条腿）。
      # 两条腿的红都会让 job 失败，而下面打 tag / 发 Release 是默认的 if: success()，
      # 于是 tag 门禁就是「两条腿都过」——这正是要的。
      - name: Cache Symfony 6.4-leg contract vendor
        uses: actions/cache@v4
        with:
          path: tools/contracts/legacy-symfony64/vendor
          key: composer-contracts-symfony64-${{ hashFiles('tools/contracts/legacy-symfony64/composer.lock') }}
      - name: Contract checks must pass before tagging（Symfony 6.4 腿）
        if: always()
        run: |
          composer install -d tools/contracts/legacy-symfony64 --no-interaction --prefer-dist
          php tools/contracts/run.php --leg=symfony64
      # 与 i18n.yml:42-43 同一条自测：先证明 check.php / generate.php 在该红的时候
      # 真的会红，这道发布门禁才值得信任（从未见过失败的检查等于没有检查）。
      # 自测只写 .selftest/ 下的临时文件，不碰交付物。
      - name: i18n self-test must pass before the locale gates are trusted
        run: php tools/i18n/selftest.php
      # 补的是审计发现的另一个洞——**源与产物之间没有任何逐字比对**：
      # check.php 只看单份产物自身的结构/链接，I18nParityTest 比的是形状
      # （标题/围栏/表格行数/标识符存活），两者都看不见「有人手改了
      # docs/i18n/<lang>/README.md」或「改了 tools/i18n/readme/<lang>.md
      # 却忘了重跑 generate.php」——这类静默漂移会一路绿到发布。
      # --verify 跑完整生成逻辑（含 autofit）但不写盘，把「将要写出的字节」
      # 与磁盘逐字节比较；不一致就点名文件与首个差异的字节/行号并非零退出。
      # 不带 --lang = 全部交付语言（清单从 lib.php 派生，不在此另写一份）。
      - name: Artefacts must be byte-identical to what generate.php would write
        run: php tools/i18n/generate.php --verify
      - name: Every locale must pass its own gate before tagging
        # 语言清单与 i18n.yml 的 for 列表逐字一致，两条链把它钉死，这里因此不复制
        # 守卫、也不引入第三份手写清单：
        #   * I18nWorkflowTest 把两个 workflow 的列表都对齐到报告页的 I18n::AVAILABLE；
        #   * i18n.yml 的 "Locale list must match tools/i18n/lib.php" 步把同一份列表
        #     对齐到 docs 侧的 I18N_LANGUAGES。两个维度都动不到这份清单。
        run: |
          for lang in en ko ru de fr es pt ar hi bn id ja; do
            echo "::group::$lang"
            php tools/i18n/check.php --lang="$lang"
            echo "::endgroup::"
          done

      - name: Compute next version
        id: version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            NEW_VERSION="$INPUT_VERSION"
          else
            LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            if [ -z "$LATEST" ]; then
              NEW_VERSION="v0.1.0"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
              # 递增哪一位由**提交类型**决定，不是恒递增 patch。
              # 恒 patch 会把一个 feature 级变更（如「新增 6 个框架兼容」）压成
              # v3.0.7，而包使用者看 semver 判断该不该升。规则即 Conventional
              # Commits：`type!:` 或 `BREAKING CHANGE` → major；`feat` → minor；
              # 其余（fix/docs/chore/test/refactor…）→ patch。
              RANGE="${LATEST}..HEAD"
              SUBJECTS=$(git log "$RANGE" --format='%s' 2>/dev/null || echo '')
              BODIES=$(git log "$RANGE" --format='%b' 2>/dev/null || echo '')
              if echo "$SUBJECTS" | grep -qE '^[a-z]+(\([^)]+\))?!:' || echo "$BODIES" | grep -q 'BREAKING CHANGE'; then
                NEW_VERSION="v$((MAJOR + 1)).0.0"
              elif echo "$SUBJECTS" | grep -qE '^feat(\([^)]+\))?:'; then
                NEW_VERSION="v$MAJOR.$((MINOR + 1)).0"
              else
                NEW_VERSION="v$MAJOR.$MINOR.$((PATCH + 1))"
              fi
              echo "自 $LATEST 起的提交类型判定 → $NEW_VERSION"
              git log "$RANGE" --format='  %s' | head -20
            fi
          fi
          if ! echo "$NEW_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version: $NEW_VERSION" >&2
            exit 1
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # 两个清单文件里的版本号必须等于**本次将发的新版本**，等于上一版也不放行：
      # 审计发现它们曾长期滞后（停在 3.0.6 而 tag 已到 v3.6.0，其间 6 个版本照常发布，
      # 装了插件的站点读到的版本号一直是错的），而「发布 v3.7.0 时两处还写着 3.6.0」
      # 正是原 bug 的形态 —— 容忍「等于上一版」会把闸门做成「只要不是完全没改就放行」。
      # 发版流程：把你这次推送**将会算出的版本**写进两处（自最新 tag 起算：
      # feat → minor，其余含 chore/fix → patch）；写错了就在下一次推送里加一个
      # chore: 提交把两处改对 —— chore 属 patch 类，不会把将算出的版本再抬走，
      # 所以纠错是收敛的（push1 红、push2 绿，tag 仍是同一个 vX.Y.Z）。
      # 位置在 Compute next version 之后、Create tag 之前：红了就不打 tag。
      - name: Version manifests match the release (before tagging)
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || true)   # 形如 v3.6.0，仅用于报错上下文
          NEW="${{ steps.version.outputs.version }}"                     # 本次将发的 tag
          ok_new="${NEW#v}"
          fail=0
          check() {   # $1=文件 $2=文件里读到的版本
            if [ "$2" = "$ok_new" ]; then
              echo "ok: $1 = $2 == 本次将发 NEW=$NEW"
            else
              echo "::error::$1 的版本是 '$2'；本次将发 NEW=$NEW，必须等于 NEW 才放行（上一版 ${LATEST:-（无 tag）} 仅供参考，等于它也不放行）—— 把这次推送将会算出的版本写进两处：feat 提交 → minor，其余（含 chore/fix）→ patch；改错了就在下一次推送里加一个 chore: 提交把两处改对（chore 属 patch 类，不会把将算出的版本再抬走）"
              fail=1
            fi
          }
          check joomla/xhprof.xml "$(grep -oP '(?<=<version>)[^<]*' joomla/xhprof.xml | head -1)"
          check wordpress/xhprof-webman.php "$(grep -m1 -oP '(?<=Version: )[0-9.]+' wordpress/xhprof-webman.php)"
          [ "$fail" = 0 ]

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.version }}" --generate-notes --title "${{ steps.version.outputs.version }}"
