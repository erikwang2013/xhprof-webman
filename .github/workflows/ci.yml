name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 连续推送时，旧的一轮测的已是过期代码，却要占满 runner 才跑完。
# group 含 workflow 名 + ref：不同 workflow 互不取消（四份 workflow 各跑各的）；
# 同一 ref 上新轮取消旧轮。写法与 release.yml:16 一致 —— 唯一刻意不同的是
# release 的 cancel-in-progress: false（发版那轮被连推取消会错版），别顺手统一。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.5 自 2026-10-03 进矩阵：进场前在本机 PHP 8.5.6 上按"Lint all PHP files"
        # 完全相同的扫描面全量 php -l 过一遍（179 个文件，0 个非 "No syntax errors"）。
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis, xhprof
          coverage: none
      # joomla/ wordpress/ 是随包交付的 PHP：仓库没有 .gitattributes（无 export-ignore）、
      # composer.json 也没有 archive.exclude，`git archive HEAD` 实测带出这两个目录。
      # 它们与 src/ 一样声明要跑在 composer.json 的 php >= 8.0 上，此前的**唯一**解析点
      # 却是契约环，而契约环钉在单一 PHP 8.3（contracts.yml 的 setup-php 步）—— 也就是说
      # 这两个目录在 8.0–8.5 矩阵里一次 php -l 都没跑过。并进扫描面，让下限真正被覆盖。
      #
      # tools/i18n/ 并入同一矩阵：它声明"全部合 PHP 8.0 语法"（i18n.yml 头部；generate.php
      # 的 Sink 构造器里就留着一处 "Not readonly" 注释 —— readonly 属性是 8.1+），而它此前
      # 唯一被 php -l 的地方是 i18n.yml 那步、跑在单一 PHP 8.3 上，只能证明"是合法 8.3"。
      # 并进来后 8.0 那一格才是那句声明的机器证据。并入前已按 8.0 逐文件核过：php-parser
      # createForVersion('8.0') 解析六份全过，并补扫了它按实测抓不到的形态（never / 首类
      # 可调用 / new in initializer / 交叉类型 / 0o777 / final const / 独立 true·false·null
      # 类型 / DNF / 类型化类常量）—— 零命中；照 smoke job 的 8.1+ 函数黑名单 grep 也是零。
      #
      # tools/contracts 不在此列：它声明 php >= 8.2（两份 composer.json），放进 8.0/8.1
      # 的矩阵格是假红。
      - name: Lint all PHP files
        run: find src tests joomla wordpress tools/i18n -name '*.php' -print0 | xargs -0 -n1 php -l

  # composer.json 声明 php >= 8.0，但 PHPUnit 11 要求 >= 8.2，
  # 单测无法在 8.0/8.1 上运行。此 job 用 --no-dev 只装运行时依赖，
  # 实测底线上代码可加载、纯逻辑可执行，避免"声明支持 8.0 却从未验证"。
  smoke:
    name: PHP ${{ matrix.php }} runtime smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis, xhprof
          coverage: none
      - name: Required extensions are really loaded
        run: |
          php -r 'foreach (["xhprof", "redis"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "missing extension: $e\n"); exit(1); } } echo "extensions ok\n";'
      # 只生成 autoloader。不能写 composer install --no-dev：--no-dev 并不会让
      # composer 跳过 require-dev 的依赖求解（官方原话：no-dev 只代表不安装），
      # 而 phpunit/phpunit ^11.5 要求 php >= 8.2，在 8.0/8.1 上解析阶段就直接失败。
      # 本项目 require 里没有任何包（仅 php + 两个扩展），故只需 autoloader；
      # dump-autoload 不做依赖求解，正合此处所需。
      - name: Generate autoloader
        run: composer dump-autoload --no-interaction
      # 扫描面与上面的 lint 一致：joomla/ wordpress/ 同样是随包交付、声明要能在 8.0 上跑的 PHP。
      - name: No post-8.0 functions in shipped PHP
        run: |
          if grep -rnE '\b(array_is_list|enum_exists|array_find|array_any|array_all|json_validate|mb_str_pad|ini_parse_quantity|memory_reset_peak_usage|mb_ucfirst|mb_lcfirst)[[:space:]]*\(' src/ joomla/ wordpress/ --include='*.php'; then
            echo "::error::src/ joomla/ wordpress/ 使用了 PHP 8.1+ 才提供的函数，与 composer.json 的 php >= 8.0 不符"
            exit 1
          fi
      - name: Load shipped classes and exercise pure logic
        run: |
          php -r '
          require "vendor/autoload.php";
          $ns = "ErikWang2013\\Xhprof\\";
          $classes = [
            "Core\\Xhprof",
            "Core\\XhprofProfiler",
            "Core\\StaticController",
            "Core\\Analysis\\Analyzer",
            "Core\\Analysis\\Finding",
            "Core\\XhprofLib\\Utils\\XhprofLib",
            "Core\\XhprofLib\\Utils\\XHProfRunsDefault",
            "Core\\XhprofLib\\Display\\XhprofDisplay",
            "Core\\XhprofLib\\Display\\FlameGraph",
          ];
          foreach ($classes as $c) {
            if (!class_exists($ns . $c)) { fwrite(STDERR, "cannot load {$ns}{$c}\n"); exit(1); }
          }
          $lib  = $ns . "Core\\XhprofLib\\Utils\\XhprofLib";
          $disp = $ns . "Core\\XhprofLib\\Display\\XhprofDisplay";
          if (count($lib::xhprof_get_possible_metrics()) !== 7) { exit(1); }
          if ($disp::xhprof_count_format(1234) !== "1,234") { exit(1); }
          echo "runtime smoke ok on ", PHP_VERSION, "\n";
          '

  test:
    name: PHP ${{ matrix.php }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 下限由 PHPUnit 11 决定（>= 8.2）；8.0/8.1 的覆盖见上面的 smoke job。
        # 8.5 自 2026-10-03 进矩阵：进场前在本机 PHP 8.5.6 上跑过全量
        # （HEAD 的干净副本 `--no-coverage`：1002 tests / 0 failures / exit 0；
        # 16 条 Deprecation 只展示不判红）。phpunit.xml 的 failOnDeprecation
        # **刻意不开启**：那 16 条是 ReflectionProperty::setAccessible()（另一批在删）
        # 与一处「null 用作数组偏移」（src/Core/XhprofLib/Utils/XhprofLib.php，不在
        # 清理批次里）—— 开了会红在非本批文件上，会无故变红的闸门会被忽略。
        php: ['8.2', '8.3', '8.4', '8.5']
        include:
          # 覆盖率只在一个格子收：单为 8.3 装 pcov（比 xdebug 省时得多），其它格子
          # coverage: none 保持原速。选 pcov 而不是 xdebug 不依赖 runner 上 xdebug 的
          # 状态：php-code-coverage 的 Selector 只要 pcov 扩展在就优先给它
          # （vendor/phpunit/php-code-coverage/src/Driver/Selector.php 的 forLineCoverage）。
          # include 的键不覆盖已有值 → 只并进 8.3 那一格，不会新增组合
          # （GitHub 矩阵 include 的语义：值与原列表一致时并入该组合）。
          - php: '8.3'
            coverage: pcov
    steps:
      - uses: actions/checkout@v4
        with:
          # 覆盖率格的差分闸门要拿 PR base sha 跑 `git diff`；默认 fetch-depth: 1
          # 只取到 merge commit 本身，base 提交不在本地 → git diff 报 unknown revision。
          # 仓库很小，四条腿全量取历史可以忽略。
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis, xhprof
          coverage: ${{ matrix.coverage || 'none' }}
      # 扩展缺失时必须显式失败：--ignore-platform-reqs 会让 composer 忽略
      # ext-xhprof/ext-redis，单测用的又是 fake，于是"全绿"其实没验证过任何真实扩展行为。
      - name: Required extensions are really loaded
        run: |
          php -r 'foreach (["xhprof", "redis"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "missing extension: $e\n"); exit(1); } } echo "extensions ok\n";'
      # 根 vendor 不随仓库分发（.gitignore 第 1 行），runner 上这步必然真去下载
      # phpunit 及其依赖树，值得缓存。键跟 composer.json 的 hash —— 根项目**刻意不提交锁**
      # （.gitignore 第 2 行 = /composer.lock，库的惯例：使用者各自解析依赖），checkout 里
      # 没有锁文件，原先 hashFiles('composer.lock') 恒为空串、键退化成常量。
      # 无锁时 composer install 是 update 语义（每次 CI 现解整棵树），缓存只省下载、
      # **不会**喂出错误依赖集：composer 与缓存带回来的 vendor/composer/installed.json
      # 对账，「缓存命中→装了旧版→假绿」不成立。诚实的边界：键反映约束、不反映解析结果，
      # PHPUnit 11.x 的补丁漂移不改键（成文策略：dev 工具链永远跟当前 11.x，炸的是 CI
      # 而不是使用者安装的包）；composer.json 还有 minimum-stability: dev +
      # prefer-stable: true，极端情况下解析可落到 dev 标记的版本。
      # 键不含 PHP 版本：依赖全是纯 PHP 包，四个矩阵格（8.2/8.3/8.4/8.5）装的字节级相同，
      # 共用一个缓存是对的 —— 只有当依赖里出现按 PHP 版本编译的扩展二进制时，才需要把
      # ${{ matrix.php }} 编进键里。键与 release.yml 的根 install 刻意同名（同一份根依赖），
      # 改要一起改。
      - name: Cache composer vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-root-${{ hashFiles('composer.json') }}
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-reqs
      - name: Run unit tests
        if: matrix.coverage != 'pcov'
        run: vendor/bin/phpunit --no-coverage
      # clover 落在哪里由 phpunit.xml:26-32 的 <coverage><report> 决定
      # （test-reports/clover.xml，已 gitignore）：产出位置只有一个来源，
      # 这条命令里不另写一遍路径。
      - name: Run unit tests (clover coverage, pcov)
        if: matrix.coverage == 'pcov'
        run: vendor/bin/phpunit
      # 自检先跑：证明闸门在该红的时候真的会红（与 i18n.yml 的
      # "Self-test must pass before the gates are trusted" 同理），再让它判别人。
      - name: Coverage gate self-test
        if: matrix.coverage == 'pcov'
        run: php tools/ci/coverage-diff.php --selftest
      # 两道闸（tools/ci/coverage-diff.php）：
      #   ① 差分闸门：只审本 PR 新增/修改的 src/ 行，未覆盖的逐行点名并非零退出 ——
      #      **不是**百分比阈值（新增文件就会假红的那种）；
      #   ② 崩落地板：总行覆盖率 < 86%（实测现状 96.7–96.9%，地板留约 10pp 余量），
      #      只防崩落不防漂移 —— 日常小幅退步不拦。
      # push 事件没有 PR base（表达式渲染成空串）→ 脚本明写「跳过差分」只跑地板；
      # PR 上 base sha 需要上面的 fetch-depth: 0 才在本地。
      - name: Coverage gates (changed lines + crash floor)
        if: matrix.coverage == 'pcov'
        run: php tools/ci/coverage-diff.php --clover=test-reports/clover.xml --base="${{ github.event.pull_request.base.sha }}"
      # always()：差分闸门红了时这一步照跑 —— 恰恰是那种时候最需要看 clover。
      - name: Upload coverage clover
        if: always() && matrix.coverage == 'pcov'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: test-reports/clover.xml
