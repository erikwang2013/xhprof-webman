  <text x="44" y="216" font-size="11.5" fill="#57606a">{{lifecycle.legend.34}}</text>
  <rect x="880" y="204" width="14" height="14" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="900" y="215.5" font-size="11.5" fill="#57606a">{{lifecycle.legend.35}}</text>
  <rect x="970" y="204" width="14" height="14" rx="3" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="990" y="215.5" font-size="11.5" fill="#57606a">{{lifecycle.legend.36}}</text>

