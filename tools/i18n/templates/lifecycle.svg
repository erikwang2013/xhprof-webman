  <line x1="700" y1="280" x2="700" y2="288" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="980" y1="280" x2="980" y2="288" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="1080" y1="280" x2="1080" y2="288" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="450" y="278" font-size="10" fill="#57606a" text-anchor="middle">{{lifecycle.axis.39}}</text>
  <text x="630" y="278" font-size="10" fill="#57606a" text-anchor="middle">{{lifecycle.axis.40}}</text>
  <text x="840" y="278" font-size="10" fill="#57606a" text-anchor="middle">{{lifecycle.axis.41}}</text>
  <text x="1030" y="278" font-size="10" fill="#57606a" text-anchor="middle">{{lifecycle.axis.42}}</text>
  <text x="1118" y="278" font-size="10" fill="#57606a" text-anchor="middle">{{lifecycle.axis.43}}</text>

  <!-- 泳道 1：PSR-15 -->
  <text x="44" y="308" font-size="11.5" font-weight="600" fill="#24292f">{{lifecycle.axis.44}}</text>
  <text x="44" y="324" font-size="10.5" fill="#57606a">{{lifecycle.axis.45}}</text>
  <rect x="340" y="300" width="816" height="24" rx="6" fill="#f6f8fa" stroke="#e1e4e8"/>
  <rect x="620" y="300" width="360" height="24" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="630" y="317" font-size="9.5" fill="#0550ae">{{lifecycle.axis.46}}</text>
  <text x="970" y="317" font-size="9.5" fill="#0550ae" text-anchor="end">{{lifecycle.axis.47}}</text>

  <!-- 泳道 2：Symfony -->
  <text x="44" y="358" font-size="11.5" font-weight="600" fill="#24292f">{{lifecycle.axis.48}}</text>
  <text x="44" y="374" font-size="10.5" fill="#57606a">{{lifecycle.axis.49}}</text>
  <rect x="340" y="350" width="816" height="24" rx="6" fill="#f6f8fa" stroke="#e1e4e8"/>
  <rect x="420" y="350" width="560" height="24" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <rect x="980" y="350" width="100" height="24" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="430" y="367" font-size="9.5" fill="#0550ae">{{lifecycle.axis.50}}</text>
  <text x="970" y="367" font-size="9.5" fill="#0550ae" text-anchor="end">{{lifecycle.axis.51}}</text>

  <!-- 泳道 3：WordPress -->
  <text x="44" y="408" font-size="11.5" font-weight="600" fill="#24292f">{{lifecycle.axis.52}}</text>
  <text x="44" y="424" font-size="10.5" fill="#57606a">{{lifecycle.axis.53}}</text>
  <rect x="340" y="400" width="816" height="24" rx="6" fill="#f6f8fa" stroke="#e1e4e8"/>
  <rect x="520" y="400" width="560" height="24" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="530" y="417" font-size="9.5" fill="#0550ae">{{lifecycle.axis.54}}</text>
  <text x="1070" y="417" font-size="9.5" fill="#0550ae" text-anchor="end">{{lifecycle.axis.55}}</text>
  <text x="336" y="408" font-size="9.5" fill="#bc4c00" text-anchor="end">{{lifecycle.axis.56}}</text>

  <!-- 泳道 4：Joomla -->
  <text x="44" y="458" font-size="11.5" font-weight="600" fill="#24292f">{{lifecycle.axis.57}}</text>
  <text x="44" y="474" font-size="10.5" fill="#57606a">{{lifecycle.axis.58}}</text>
  <rect x="340" y="450" width="816" height="24" rx="6" fill="#f6f8fa" stroke="#e1e4e8"/>
  <rect x="470" y="450" width="510" height="24" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <rect x="980" y="450" width="100" height="24" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="480" y="467" font-size="9.5" fill="#0550ae">{{lifecycle.axis.59}}</text>
  <text x="970" y="467" font-size="9.5" fill="#0550ae" text-anchor="end">{{lifecycle.axis.60}}</text>

  <!-- 泳道 5：Drupal -->
  <text x="44" y="508" font-size="11.5" font-weight="600" fill="#24292f">{{lifecycle.axis.61}}</text>
  <text x="44" y="524" font-size="10.5" fill="#57606a">{{lifecycle.axis.62}}</text>
  <rect x="340" y="500" width="816" height="24" rx="6" fill="#f6f8fa" stroke="#e1e4e8"/>
  <rect x="440" y="500" width="540" height="24" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="450" y="517" font-size="9.5" fill="#0550ae">{{lifecycle.axis.63}}</text>
  <text x="970" y="517" font-size="9.5" fill="#0550ae" text-anchor="end">{{lifecycle.axis.64}}</text>
</svg>
