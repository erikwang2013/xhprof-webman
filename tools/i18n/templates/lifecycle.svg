  <rect x="1024" y="100" width="128" height="96" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <circle cx="1040" cy="118" r="9" fill="#1a7f37"/>
  <text x="1040" y="121.5" font-size="10" fill="#ffffff" text-anchor="middle">{{lifecycle.pipeline.30}}</text>
  <text x="1034" y="142" font-size="10.5" fill="#24292f">{{lifecycle.pipeline.31}}</text>
  <text x="1034" y="156" font-size="10.5" fill="#57606a">{{lifecycle.pipeline.32}}</text>
  <text x="1034" y="170" font-size="10.5" fill="#57606a">{{lifecycle.pipeline.33}}</text>

