  <rect x="884" y="100" width="128" height="96" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <circle cx="900" cy="118" r="9" fill="#1a7f37"/>
  <text x="900" y="121.5" font-size="10" fill="#ffffff" text-anchor="middle">{{lifecycle.pipeline.26}}</text>
  <text x="894" y="142" font-size="10.5" fill="#24292f">{{lifecycle.pipeline.27}}</text>
  <text x="894" y="156" font-size="10.5" fill="#24292f">{{lifecycle.pipeline.28}}</text>
  <text x="894" y="170" font-size="10.5" fill="#57606a">{{lifecycle.pipeline.29}}</text>
  <line x1="1012" y1="148" x2="1022" y2="148" stroke="#57606a" stroke-width="1.5" marker-end="url(#lc-arrow)"/>

