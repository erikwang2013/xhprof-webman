  <rect x="604" y="100" width="128" height="96" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <circle cx="620" cy="118" r="9" fill="#0969da"/>
  <text x="620" y="121.5" font-size="10" fill="#ffffff" text-anchor="middle">{{lifecycle.pipeline.20}}</text>
  <text x="614" y="142" font-size="10.5" fill="#24292f">{{lifecycle.pipeline.21}}</text>
  <text x="614" y="156" font-size="10.5" fill="#57606a">{{lifecycle.pipeline.22}}</text>
  <line x1="732" y1="148" x2="742" y2="148" stroke="#57606a" stroke-width="1.5" marker-end="url(#lc-arrow)"/>

