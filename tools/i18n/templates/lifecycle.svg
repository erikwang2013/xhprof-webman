<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif">
  <title>{{lifecycle.meta.title}}</title>
  <desc>{{lifecycle.meta.desc}}</desc>

  <defs>
    <marker id="lc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#f6f8fa"/>

  <!-- ============ 标题 ============ -->
  <text x="32" y="44" font-size="22" font-weight="700" fill="#24292f">{{lifecycle.title.1}}</text>
  <text x="32" y="70" font-size="13" fill="#57606a">{{lifecycle.title.2}}</text>

  <!-- ============ 管线 8 阶段 ============ -->
  <!-- 1 请求进入 -->
  <rect x="44" y="100" width="128" height="96" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="60" cy="118" r="9" fill="#0969da"/>
  <text x="60" y="121.5" font-size="10" fill="#ffffff" text-anchor="middle">{{lifecycle.pipeline.3}}</text>
  <text x="54" y="142" font-size="10.5" fill="#24292f">{{lifecycle.pipeline.4}}</text>
  <text x="54" y="156" font-size="10.5" fill="#57606a">{{lifecycle.pipeline.5}}</text>
  <line x1="172" y1="148" x2="182" y2="148" stroke="#57606a" stroke-width="1.5" marker-end="url(#lc-arrow)"/>

  <!-- 2 入口类短路判断 -->
  <rect x="184" y="100" width="128" height="96" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <circle cx="200" cy="118" r="9" fill="#bc4c00"/>
  <text x="200" y="121.5" font-size="10" fill="#ffffff" text-anchor="middle">{{lifecycle.pipeline.6}}</text>
  <text x="194" y="142" font-size="10.5" fill="#24292f">{{lifecycle.pipeline.7}}</text>
  <text x="194" y="156" font-size="10.5" fill="#57606a">{{lifecycle.pipeline.8}}</text>
  <text x="194" y="170" font-size="10.5" fill="#57606a">{{lifecycle.pipeline.9}}</text>
  <text x="194" y="184" font-size="10.5" fill="#57606a">{{lifecycle.pipeline.10}}</text>
  <line x1="312" y1="148" x2="322" y2="148" stroke="#57606a" stroke-width="1.5" marker-end="url(#lc-arrow)"/>

  <!-- 3 bootstrap -->
  <rect x="324" y="100" width="128" height="96" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="340" cy="118" r="9" fill="#0969da"/>
  <text x="340" y="121.5" font-size="10" fill="#ffffff" text-anchor="middle">{{lifecycle.pipeline.11}}</text>
  <text x="334" y="142" font-size="10.5" fill="#24292f">{{lifecycle.pipeline.12}}</text>
  <text x="334" y="156" font-size="10.5" fill="#24292f">{{lifecycle.pipeline.13}}</text>
  <text x="334" y="170" font-size="10.5" fill="#57606a">{{lifecycle.pipeline.14}}</text>
  <text x="334" y="184" font-size="10.5" fill="#57606a">{{lifecycle.pipeline.15}}</text>
  <line x1="452" y1="148" x2="462" y2="148" stroke="#57606a" stroke-width="1.5" marker-end="url(#lc-arrow)"/>

  <!-- 4 双重判断 -->
  <rect x="464" y="100" width="128" height="96" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="480" cy="118" r="9" fill="#0969da"/>
  <text x="480" y="121.5" font-size="10" fill="#ffffff" text-anchor="middle">{{lifecycle.pipeline.16}}</text>
  <text x="474" y="142" font-size="10.5" fill="#24292f">{{lifecycle.pipeline.17}}</text>
  <text x="474" y="156" font-size="10.5" fill="#24292f">{{lifecycle.pipeline.18}}</text>
