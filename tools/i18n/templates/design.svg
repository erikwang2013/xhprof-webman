  <rect x="24" y="452" width="376" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="40" y="474" font-size="12.5" font-weight="600" fill="#0550ae">{{design.row4.34}}</text>
  <text x="40" y="494" font-size="11" fill="#24292f">{{design.row4.35}}</text>
  <text x="40" y="510" font-size="11" fill="#24292f">{{design.row4.36}}</text>

  <rect x="412" y="452" width="376" height="80" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="428" y="474" font-size="12.5" font-weight="600" fill="#1a7f37">{{design.row4.37}}</text>
  <text x="428" y="494" font-size="11" fill="#24292f">{{design.row4.38}}</text>
  <text x="428" y="510" font-size="11" fill="#24292f">{{design.row4.39}}</text>

