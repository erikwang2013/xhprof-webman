  <text x="816" y="474" font-size="12.5" font-weight="600" fill="#bc4c00">{{design.row4.40}}</text>
  <text x="816" y="494" font-size="11" fill="#24292f">{{design.row4.41}}</text>
  <text x="816" y="510" font-size="11" fill="#24292f">{{design.row4.42}}</text>

