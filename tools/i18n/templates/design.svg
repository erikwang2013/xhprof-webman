  <rect x="24" y="542" width="376" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="40" y="564" font-size="12.5" font-weight="600" fill="#0550ae">{{design.row5.43}}</text>
  <text x="40" y="584" font-size="11" fill="#24292f">{{design.row5.44}}</text>
  <text x="40" y="600" font-size="11" fill="#24292f">{{design.row5.45}}</text>

  <rect x="412" y="542" width="376" height="80" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="428" y="564" font-size="12.5" font-weight="600" fill="#1a7f37">{{design.row5.46}}</text>
  <text x="428" y="584" font-size="11" fill="#24292f">{{design.row5.47}}</text>
  <text x="428" y="600" font-size="11" fill="#24292f">{{design.row5.48}}</text>

  <rect x="800" y="542" width="376" height="80" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="816" y="564" font-size="12.5" font-weight="600" fill="#bc4c00">{{design.row5.49}}</text>
  <text x="816" y="584" font-size="11" fill="#24292f">{{design.row5.50}}</text>
  <text x="816" y="600" font-size="11" fill="#24292f">{{design.row5.51}}</text>
