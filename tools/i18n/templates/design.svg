  <rect x="24" y="182" width="376" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="40" y="204" font-size="12.5" font-weight="600" fill="#0550ae">{{design.row1.7}}</text>
  <text x="40" y="224" font-size="11" fill="#24292f">{{design.row1.8}}</text>
  <text x="40" y="240" font-size="11" fill="#24292f">{{design.row1.9}}</text>

  <rect x="412" y="182" width="376" height="80" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="428" y="204" font-size="12.5" font-weight="600" fill="#1a7f37">{{design.row1.10}}</text>
  <text x="428" y="224" font-size="11" fill="#24292f">{{design.row1.11}}</text>
  <text x="428" y="240" font-size="11" fill="#24292f">{{design.row1.12}}</text>

  <rect x="800" y="182" width="376" height="80" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
