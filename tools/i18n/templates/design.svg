  <text x="444" y="168" font-size="12.5" font-weight="600" fill="#1a7f37">{{design.header.5}}</text>

  <rect x="800" y="146" width="376" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="814" y="157" width="10" height="10" rx="2" fill="#bc4c00"/>
  <text x="832" y="168" font-size="12.5" font-weight="600" fill="#bc4c00">{{design.header.6}}</text>

