  <text x="32" y="70" font-size="13" fill="#57606a">{{design.title.2}}</text>

  <!-- 结论条 -->
  <rect x="24" y="88" width="1152" height="42" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="600" y="114" font-size="14" font-weight="600" fill="#0550ae" text-anchor="middle">{{design.conclusion.3}}</text>

  <!-- ============ 表头 ============ -->
  <rect x="24" y="146" width="376" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="38" y="157" width="10" height="10" rx="2" fill="#0969da"/>
  <text x="56" y="168" font-size="12.5" font-weight="600" fill="#0969da">{{design.header.4}}</text>

  <rect x="412" y="146" width="376" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
