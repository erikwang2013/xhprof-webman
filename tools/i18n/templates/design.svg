  <text x="816" y="384" font-size="12.5" font-weight="600" fill="#bc4c00">{{design.row3.31}}</text>
  <text x="816" y="404" font-size="11" fill="#24292f">{{design.row3.32}}</text>
  <text x="816" y="420" font-size="11" fill="#24292f">{{design.row3.33}}</text>

