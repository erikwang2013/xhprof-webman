  <rect x="24" y="362" width="376" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="40" y="384" font-size="12.5" font-weight="600" fill="#0550ae">{{design.row3.25}}</text>
  <text x="40" y="404" font-size="11" fill="#24292f">{{design.row3.26}}</text>
  <text x="40" y="420" font-size="11" fill="#24292f">{{design.row3.27}}</text>

  <rect x="412" y="362" width="376" height="80" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="428" y="384" font-size="12.5" font-weight="600" fill="#1a7f37">{{design.row3.28}}</text>
  <text x="428" y="404" font-size="11" fill="#24292f">{{design.row3.29}}</text>
  <text x="428" y="420" font-size="11" fill="#24292f">{{design.row3.30}}</text>

