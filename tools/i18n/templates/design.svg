  <rect x="24" y="272" width="376" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="40" y="294" font-size="12.5" font-weight="600" fill="#0550ae">{{design.row2.16}}</text>
  <text x="40" y="314" font-size="11" fill="#24292f">{{design.row2.17}}</text>
